name: build

# Continuous integration. A push or a pull request runs the test suite on Linux and Windows and
# nothing else. The per-platform bridges and the package are built only by the pack workflow,
# which is run by hand from the Actions tab, so what a commit message says decides nothing here.

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', '.gitignore', 'LICENSE', '.idea/**']

# A run is disposable, so a newer push supersedes it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    uses: ./.github/workflows/package.yml
    with:
      pack: false
      test_os: '["ubuntu-24.04", "windows-latest"]'
