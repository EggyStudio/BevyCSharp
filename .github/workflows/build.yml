name: build

# Continuous integration. The work itself lives in package.yml, which releases call too, so the
# runtime identifier matrix cannot drift between the two.

on:
  push:
    branches: [main, master]
    # A full run is around an hour of runner time, so changes that cannot affect the binaries do
    # not start one. Note that a skipped workflow reports no status at all, so do not mark this
    # one as a required check while these filters are here.
    paths-ignore: ['**.md', '.gitignore', 'LICENSE', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', '.gitignore', 'LICENSE', '.idea/**']
  workflow_dispatch:

# Pushing twice in quick succession would otherwise leave two hour-long runs racing when only
# the newer one matters. In-flight runs for the same ref are cancelled, except on the default
# branch where the finished artifacts are worth keeping.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  package:
    # No version is passed, so the package keeps the one in Directory.Build.props. Continuous
    # integration packages are for downloading and inspecting, not for publishing.
    uses: ./.github/workflows/package.yml
