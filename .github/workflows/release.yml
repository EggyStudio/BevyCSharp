name: release

# Publishes a tagged version to GitHub Packages.
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# Pushes to the default branch already publish automatically, with a version that counts up on
# its own. This is for the other case: pinning an exact, meaningful version number. The tag
# drives it, so nothing has to be edited in the repository to cut a release, and the binaries
# are built from exactly the tagged commit rather than reused from an older run.
#
# This lives apart from build.yml because tag pushes and path filters interact badly: a tag on a
# documentation-only commit can be filtered out and the release would silently never happen.
# Keeping the triggers separate removes that trap entirely.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (for example 0.2.0).'
        type: string
        required: true

# A release must never be half-published, so runs are queued rather than cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.pick.outputs.value }}

    steps:
      - name: Resolve the version
        id: pick
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            # refs/tags/v0.2.0 arrives as v0.2.0; NuGet wants it without the v.
            version="${GITHUB_REF_NAME#v}"
          fi

          # Fail here rather than after an hour of building, with a package NuGet would reject.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid NuGet version. Tag as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version"

  package:
    name: package
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.value }}

  publish:
    name: publish
    needs: [version, package]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.value }}
    permissions:
      contents: read
      packages: write
