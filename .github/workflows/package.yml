name: package

# Builds the native bridge for every runtime identifier, runs the test suite, and packs the lot
# into one NuGet package. With `pack: false` it runs the test suite and stops there.
#
# This is a reusable workflow rather than a standalone one, because continuous integration and
# releases need exactly the same work done. Keeping it in one place means the runtime identifier
# matrix cannot drift between them.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Package version to stamp. Empty keeps the version from Directory.Build.props, which is
          what continuous integration wants; a release passes the tag.
        type: string
        required: false
        default: ''
      pack:
        description: >-
          Whether to build the per-platform native bridges and pack them. False runs the test
          suite alone, which is what an ordinary push needs, since the bridges are only used to
          assemble a package.
        type: boolean
        required: false
        default: true
      targets:
        description: >-
          JSON array of {os, rid, target} objects to build. Defaults to every desktop runtime
          identifier, since a package is only worth making when it covers all of them.
        type: string
        required: false
        default: >-
          [
            {"os": "ubuntu-latest",    "rid": "linux-x64",   "target": "x86_64-unknown-linux-gnu"},
            {"os": "ubuntu-24.04-arm", "rid": "linux-arm64", "target": "aarch64-unknown-linux-gnu"},
            {"os": "windows-latest",   "rid": "win-x64",     "target": "x86_64-pc-windows-msvc"},
            {"os": "windows-11-arm",   "rid": "win-arm64",   "target": "aarch64-pc-windows-msvc"},
            {"os": "macos-latest",     "rid": "osx-arm64",   "target": "aarch64-apple-darwin"},
            {"os": "macos-latest",     "rid": "osx-x64",     "target": "x86_64-apple-darwin"}
          ]
      test_os:
        description: 'JSON array of runner labels to run the test suite on.'
        type: string
        required: false
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CARGO_TERM_COLOR: always


jobs:
  native:
    name: native (${{ matrix.rid }})
    if: ${{ inputs.pack }}
    runs-on: ${{ matrix.os }}
    # A cold render build compiles the whole of Bevy, wgpu and winit, which is roughly a quarter
    # of an hour. The cap is here so a label no runner answers fails in minutes instead of
    # queueing for the six-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both macOS slices build on the same Apple Silicon runner. Apple's toolchain is
        # multi-arch, so an x86_64 binary cross-compiles cleanly from arm64, and there is no
        # Intel runner image left to target natively anyway. See the `targets` input for the
        # full default list.
        include: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}

      # The only development package a render build needs. Everything else graphical resolves at
      # runtime: winit reaches X11 and Wayland through dlopen, and wgpu loads Vulkan the same way.
      # Audio is the exception, because cpal links against ALSA. Windows and macOS reach their
      # audio APIs through the system SDK, so this is Linux only.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev

      - name: Build native bridge
        shell: bash
        run: build/build-native.sh --render --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: build/artifacts/${{ matrix.rid }}/*
          if-no-files-found: error
          # republish.yml reuses these to repack around a readme or metadata change without
          # rebuilding. Two weeks is how long that shortcut stays available after a full build.
          retention-days: 14

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test_os) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: test-${{ matrix.os }}

      # The suite runs headless everywhere, so the smaller profile is enough and much faster.
      - name: Build native bridge
        shell: bash
        run: build/build-native.sh

      # The bridge's own tests, which cover the pieces no managed test can reach: the text
      # protocol, the panic guard, and that registering an asset type twice is inert.
      - name: Test the bridge
        working-directory: native
        run: cargo test

      - name: Test
        run: dotnet test BevyCSharp.Tests/BevyCSharp.Tests.csproj -c Release

  pack:
    name: pack
    if: ${{ inputs.pack }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [native, test]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Every runtime identifier's bridge, laid back out the way the csproj expects to find it.
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: staging

      - name: Collect native artifacts
        shell: bash
        run: |
          mkdir -p build/artifacts
          for dir in staging/native-*; do
            rid="${dir#staging/native-}"
            mkdir -p "build/artifacts/$rid"
            cp "$dir"/* "build/artifacts/$rid/"
          done
          find build/artifacts -type f | sort

      # The staleness guard in the csproj compares timestamps against the Rust sources, and a
      # fresh checkout writes those after the downloaded artifacts. The binaries came from this
      # very commit, so the check has nothing useful to say here.
      - name: Pack
        shell: bash
        run: |
          args=(-c Release -p:BevyCSharpSkipNativeFreshnessCheck=true)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(-p:Version=${{ inputs.version }})
          fi
          dotnet pack BevyCSharp/BevyCSharp.csproj "${args[@]}"

      - name: Show what shipped
        shell: bash
        run: unzip -l build/package/*.nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: build/package/*.nupkg
          if-no-files-found: error
