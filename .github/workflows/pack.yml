# Builds the bridge for every platform, tests on Linux and Windows, and packs, when run from the
# Actions tab ("Run workflow"), and pushes the package to nuget.org when asked to. Nothing is
# packed unless every bridge built and both test jobs passed.
#
# The version is build/version.sh's, the major and minor in build/version.txt and as the patch the
# commits since that file last changed. The package is kept as the run's artifact either way, so a
# pack can be checked, or uploaded by hand, before one is pushed.
name: pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the package to nuget.org (needs the NUGET_API_KEY secret)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history, since the patch counts commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: echo "version=$(build/version.sh)" >> "$GITHUB_OUTPUT"

  package:
    name: package
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      pack: true
      test_os: '["ubuntu-24.04", "windows-latest", "macos-latest"]'

  publish:
    name: publish
    needs: [version, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: BevyCSharp-${{ needs.version.outputs.version }}
          path: package

      - name: Push to nuget.org
        if: ${{ inputs.publish }}
        run: dotnet nuget push "package/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Say what was made
        run: |
          echo "### BevyCSharp ${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Packed and kept as this run's artifact, not pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
