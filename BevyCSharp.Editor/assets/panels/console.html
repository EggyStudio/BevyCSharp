<html lang="en">
  <head>
    <meta name="console" />
    <title>Console</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="band" id="console">
      <div class="titlebar" id="console-title">
        <p class="title">Console</p>
        <p class="dim" id="c-count"></p>
      </div>

      <!--
        What is shown and what is looked for. The three chips are the levels: a console that cannot
        be narrowed to the errors is a console nobody reads twice.
      -->
      <div class="line">
        <input class="grow" id="c-filter" type="text" placeholder="find" />
        <div class="chip" id="c-info"><p class="chip-text">Info</p></div>
        <div class="chip" id="c-warn"><p class="chip-text">Warnings</p></div>
        <div class="chip" id="c-bad"><p class="chip-text">Errors</p></div>
        <div class="field-btn" id="c-clear"><p class="btn-text">Clear</p></div>
      </div>

      <div class="rows-grow" id="c-rows">
        <p class="log" id="crow-0"></p>
        <p class="log" id="crow-1"></p>
        <p class="log" id="crow-2"></p>
        <p class="log" id="crow-3"></p>
        <p class="log" id="crow-4"></p>
        <p class="log" id="crow-5"></p>
        <p class="log" id="crow-6"></p>
        <p class="log" id="crow-7"></p>
        <p class="log" id="crow-8"></p>
        <p class="log" id="crow-9"></p>
        <p class="log" id="crow-10"></p>
        <p class="log" id="crow-11"></p>
        <p class="log" id="crow-12"></p>
        <p class="log" id="crow-13"></p>
        <p class="log" id="crow-14"></p>
        <p class="log" id="crow-15"></p>
        <p class="log" id="crow-16"></p>
        <p class="log" id="crow-17"></p>
      </div>

      <!-- What is typed. The prompt is a character rather than a label for the obvious reason. -->
      <div class="line">
        <p class="prompt">&gt;</p>
        <input class="grow" id="c-input" type="text" placeholder="command" />
      </div>

      <p class="dim" id="c-hint"></p>
    </div>
  </body>
</html>
