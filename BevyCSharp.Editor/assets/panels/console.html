<html lang="en">
  <head>
    <meta name="console" />
    <title>Console</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="panel wide" id="console">
      <div class="titlebar" id="console-title">
        <p class="title">Console</p>
        <p class="dim" id="c-count"></p>
      </div>

      <div class="bar flush">
        <button id="c-clear">Clear</button>
      </div>

      <div class="rows">
        <p class="row log" id="crow-0"></p>
        <p class="row log" id="crow-1"></p>
        <p class="row log" id="crow-2"></p>
        <p class="row log" id="crow-3"></p>
        <p class="row log" id="crow-4"></p>
        <p class="row log" id="crow-5"></p>
        <p class="row log" id="crow-6"></p>
        <p class="row log" id="crow-7"></p>
        <p class="row log" id="crow-8"></p>
        <p class="row log" id="crow-9"></p>
        <p class="row log" id="crow-10"></p>
      </div>
    </div>
  </body>
</html>
