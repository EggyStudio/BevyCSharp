<html lang="en">
  <head>
    <meta name="hierarchy" />
    <title>Hierarchy</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="panel" id="hierarchy">
      <div class="titlebar" id="hierarchy-title">
        <p class="title">Hierarchy</p>
        <p class="dim" id="hier-count"></p>
      </div>

      <input id="hier-filter" type="text" placeholder="filter" />

      <div class="field-row">
        <p class="field-name">Interface</p>
        <checkbox id="hier-interface"></checkbox>
      </div>

      <div class="rows">
        <button class="row" id="hrow-0"></button>
        <button class="row" id="hrow-1"></button>
        <button class="row" id="hrow-2"></button>
        <button class="row" id="hrow-3"></button>
        <button class="row" id="hrow-4"></button>
        <button class="row" id="hrow-5"></button>
        <button class="row" id="hrow-6"></button>
        <button class="row" id="hrow-7"></button>
        <button class="row" id="hrow-8"></button>
        <button class="row" id="hrow-9"></button>
        <button class="row" id="hrow-10"></button>
        <button class="row" id="hrow-11"></button>
        <button class="row" id="hrow-12"></button>
        <button class="row" id="hrow-13"></button>
        <button class="row" id="hrow-14"></button>
        <button class="row" id="hrow-15"></button>
        <button class="row" id="hrow-16"></button>
        <button class="row" id="hrow-17"></button>
      </div>

      <div class="bar">
        <button id="hier-up">Up</button>
        <button id="hier-down">Down</button>
        <button id="hier-new">New</button>
        <button id="hier-delete">Delete</button>
      </div>
    </div>
  </body>
</html>
