<html lang="en">
  <head>
    <meta name="post" />
    <title>Post processing</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="window">
      <h2>Post processing</h2>

      <div class="row">
        <label>Bloom</label>
        <checkbox id="bloom"></checkbox>
      </div>

      <div class="row">
        <label>Intensity</label>
        <slider id="intensity" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="row">
        <label>Sharpen</label>
        <slider id="sharpen" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="row">
        <label>Note</label>
        <input id="note" type="text" placeholder="what this looks like" />
      </div>

      <!--
        A readout is a <p>, not a <span> and not a <label>. The parser turns a fixed set of tags
        into elements: <span> is not in it at all, and a <label> is consumed to caption the widget
        beside it rather than becoming an element of its own. Either way there is no entity, and
        nothing can bind to what has no entity.
      -->
      <div class="row">
        <p class="muted">Readout</p>
        <p id="readout" class="muted">idle</p>
      </div>

      <button id="apply">Apply to camera</button>
    </div>
  </body>
</html>
