<html lang="en">
  <head>
    <meta name="post" />
    <title>Post processing</title>
    <link rel="stylesheet" href="../themes/editor.css" />
  </head>
  <body>
    <div class="window">
      <h2>Post processing</h2>

      <div class="row">
        <label>Bloom</label>
        <checkbox id="bloom"></checkbox>
      </div>

      <div class="row">
        <label>Intensity</label>
        <slider id="intensity" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="row">
        <label>Sharpen</label>
        <slider id="sharpen" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="row">
        <label>Note</label>
        <input id="note" type="text" placeholder="what this looks like" />
      </div>

      <div class="row">
        <span class="muted">Readout</span>
        <span id="readout" class="muted">idle</span>
      </div>

      <button id="apply">Apply to camera</button>
    </div>
  </body>
</html>
