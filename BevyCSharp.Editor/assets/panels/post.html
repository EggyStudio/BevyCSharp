<html lang="en">
  <head>
    <meta name="post" />
    <title>Post processing</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="panel">
      <h2>Post processing</h2>

      <!--
        Captions are <p>, not <label>. A label is not drawn where it sits: the parser collects it
        by its `for` attribute and hands the text to that widget, and only some widgets draw one.
        A checkbox and a slider do not, so the caption would simply vanish.
      -->
      <div class="field">
        <p>Bloom</p>
        <checkbox id="bloom"></checkbox>
      </div>

      <div class="field">
        <p>Intensity</p>
        <slider id="intensity" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="field">
        <p>Sharpen</p>
        <slider id="sharpen" min="0" max="1" step="0.01"></slider>
      </div>

      <div class="field">
        <p>Note</p>
        <input id="note" type="text" placeholder="what this looks like" />
      </div>

      <div class="field">
        <p class="dim">Camera</p>
        <p id="readout" class="dim">off</p>
      </div>

      <button id="reset">Reset</button>
    </div>
  </body>
</html>
