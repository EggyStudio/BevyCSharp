<html lang="en">
  <head>
    <meta name="world" />
    <title>World</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="panel fill" id="world">
      <div class="titlebar" id="world-title">
        <p class="title">World</p>
        <p class="dim" id="w-count"></p>
      </div>

      <div class="bar flush">
        <button class="icon" id="w-menu"></button>
        <button class="icon" id="w-undo"></button>
        <button class="icon" id="w-redo"></button>
        <button class="icon" id="w-save"></button>
        <button class="icon" id="w-add"></button>
      </div>

      <input id="w-filter" type="text" placeholder="search" />

      <div class="rows grow">
        <button class="row" id="wrow-0"></button>
        <button class="row" id="wrow-1"></button>
        <button class="row" id="wrow-2"></button>
        <button class="row" id="wrow-3"></button>
        <button class="row" id="wrow-4"></button>
        <button class="row" id="wrow-5"></button>
        <button class="row" id="wrow-6"></button>
        <button class="row" id="wrow-7"></button>
        <button class="row" id="wrow-8"></button>
        <button class="row" id="wrow-9"></button>
        <button class="row" id="wrow-10"></button>
        <button class="row" id="wrow-11"></button>
        <button class="row" id="wrow-12"></button>
        <button class="row" id="wrow-13"></button>
        <button class="row" id="wrow-14"></button>
        <button class="row" id="wrow-15"></button>
        <button class="row" id="wrow-16"></button>
        <button class="row" id="wrow-17"></button>
        <button class="row" id="wrow-18"></button>
        <button class="row" id="wrow-19"></button>
        <button class="row" id="wrow-20"></button>
        <button class="row" id="wrow-21"></button>
        <button class="row" id="wrow-22"></button>
        <button class="row" id="wrow-23"></button>
      </div>
    </div>
  </body>
</html>
