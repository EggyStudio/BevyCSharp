<html lang="en">
  <head>
    <meta name="barbottom" />
    <title>barbottom</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="floatbar" id="barbottom">
      <div class="round" id="tb-0">
        <img class="glyph" id="tbimg-0" src="/icons/ui/cube.png" alt="" />
        <p class="glyph-text" id="tbtxt-0"></p>
        <p class="glyph-dot" id="tbdot-0"></p>
      </div>
      <div class="round" id="tb-1">
        <img class="glyph" id="tbimg-1" src="/icons/ui/cube.png" alt="" />
        <p class="glyph-text" id="tbtxt-1"></p>
        <p class="glyph-dot" id="tbdot-1"></p>
      </div>
      <div class="round" id="tb-2">
        <img class="glyph" id="tbimg-2" src="/icons/ui/cube.png" alt="" />
        <p class="glyph-text" id="tbtxt-2"></p>
        <p class="glyph-dot" id="tbdot-2"></p>
      </div>
      <div class="round" id="tb-3">
        <img class="glyph" id="tbimg-3" src="/icons/ui/cube.png" alt="" />
        <p class="glyph-text" id="tbtxt-3"></p>
        <p class="glyph-dot" id="tbdot-3"></p>
      </div>
      <!--
        The square the orientation cross is drawn into. Empty and transparent on purpose: what
        fills it is three lines in the scene, and all this element does is say where they go and
        take the click. Being in the bar is what makes it follow the layout, so it sits beside the
        other buttons and moves inwards when a panel opens.
      -->
      <div class="gizmo-slot" id="tb-cross"></div>
    </div>
  </body>
</html>
