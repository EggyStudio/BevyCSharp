      <!--
        A pool of rows, all the same shape: a mark, a name, and a body holding everything a value
        can be drawn as. The name is a column of its own width, so every value in the panel starts
        at the same place however long the names are, and a drawer that wants the whole width says
        so and the name is not drawn at all.

        Which pieces a row shows is decided as the panel is filled. Nothing here knows what a
        component is, and nothing here changes for one to be shown.
      -->

        description of. Both are "there is nothing to edit here", which is a word on a chip rather
        than a heading with an empty space under it.

        Under the list rather than inside it, but shown only once the list has been scrolled to its
        end, so that everything the panel holds still scrolls together. Under it, the panel can
        measure how tall it is and give the rows what is left; inside it, the rows and the tail
        argue over the same space and the button ends up half off the bottom.
      -->
      <p class="dim" id="d-tags">Tags</p>
      <div class="chips" id="dchips">
        <div class="chip" id="dchip-0"><p class="chip-text" id="dchiptext-0"></p></div>
        <div class="chip" id="dchip-1"><p class="chip-text" id="dchiptext-1"></p></div>
        <div class="chip" id="dchip-2"><p class="chip-text" id="dchiptext-2"></p></div>
        <div class="chip" id="dchip-3"><p class="chip-text" id="dchiptext-3"></p></div>
        <div class="chip" id="dchip-4"><p class="chip-text" id="dchiptext-4"></p></div>
        <div class="chip" id="dchip-5"><p class="chip-text" id="dchiptext-5"></p></div>
        <div class="chip" id="dchip-6"><p class="chip-text" id="dchiptext-6"></p></div>
        <div class="chip" id="dchip-7"><p class="chip-text" id="dchiptext-7"></p></div>
        <div class="chip" id="dchip-8"><p class="chip-text" id="dchiptext-8"></p></div>
        <div class="chip" id="dchip-9"><p class="chip-text" id="dchiptext-9"></p></div>
        <div class="chip" id="dchip-10"><p class="chip-text" id="dchiptext-10"></p></div>
        <div class="chip" id="dchip-11"><p class="chip-text" id="dchiptext-11"></p></div>
        <div class="chip" id="dchip-12"><p class="chip-text" id="dchiptext-12"></p></div>
        <div class="chip" id="dchip-13"><p class="chip-text" id="dchiptext-13"></p></div>
        <div class="chip" id="dchip-14"><p class="chip-text" id="dchiptext-14"></p></div>
        <div class="chip" id="dchip-15"><p class="chip-text" id="dchiptext-15"></p></div>
        <div class="chip" id="dchip-16"><p class="chip-text" id="dchiptext-16"></p></div>
        <div class="chip" id="dchip-17"><p class="chip-text" id="dchiptext-17"></p></div>
        <div class="chip" id="dchip-18"><p class="chip-text" id="dchiptext-18"></p></div>
        <div class="chip" id="dchip-19"><p class="chip-text" id="dchiptext-19"></p></div>
        <div class="chip" id="dchip-20"><p class="chip-text" id="dchiptext-20"></p></div>
        <div class="chip" id="dchip-21"><p class="chip-text" id="dchiptext-21"></p></div>
        <div class="chip" id="dchip-22"><p class="chip-text" id="dchiptext-22"></p></div>
        <div class="chip" id="dchip-23"><p class="chip-text" id="dchiptext-23"></p></div>
      </div>

      <div class="wide-btn" id="d-add"><p class="btn-text">Add component</p></div>
    </div>

    <!--
      What the row under the pointer is for, placed beside that row while it is there.

      Outside the panel rather than in it, because a panel clips what does not fit inside it and a
      hint about the last row would be cut in half by the edge it is next to.
    -->
    <div class="hint" id="d-hint"><p class="hint-text" id="d-hint-text"></p></div>
  </body>
</html>
