<html lang="en">
  <head>
    <meta name="toolbar" />
    <title>Toolbar</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="bar" id="toolbar">
      <button class="tool" id="t-select">Select</button>
      <button class="tool" id="t-move">Move</button>
      <button class="tool" id="t-rotate">Rotate</button>
      <button class="tool" id="t-scale">Scale</button>
      <button class="tool" id="t-snap">Snap</button>
      <button class="icon" id="t-info"></button>
    </div>
  </body>
</html>
