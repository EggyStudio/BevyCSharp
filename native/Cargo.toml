[workspace]
resolver = "2"
members = ["bevy_csharp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# NOT `panic = "abort"`: the C ABI relies on `catch_unwind` to stop a Rust panic
# from unwinding into the .NET runtime, and abort would bypass that guard entirely.
panic = "unwind"
