[package]
name = "bevy_csharp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bridge exposing the Bevy engine to .NET (BevyCSharp)."

[lib]
name = "bevy_csharp"
crate-type = ["cdylib", "rlib"]

[features]
default = ["headless"]

# Minimal profile: app + ECS + time + input + transform + math.
# No window, no GPU, no audio. Drives the loop with ScheduleRunnerPlugin.
# This is what CI, unit tests and dedicated servers build.
headless = [
    "bevy/std",
    "bevy/async_executor",
    "bevy/multi_threaded",
    "bevy/bevy_log",
    "bevy/keyboard",
    "bevy/mouse",
]

# Full desktop profile: DefaultPlugins with windowing, renderer and input backend.
# Requires the platform development packages (X11/Wayland, alsa, udev, vulkan loader).
render = [
    "headless",
    "bevy/default_app",
    "bevy/default_platform",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_sprite",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_gizmos",
    "bevy/bevy_asset",
    "bevy/bevy_scene",
    "bevy/png",
    "bevy/ktx2",
    "bevy/zstd_rust",
    "bevy/tonemapping_luts",
    "bevy/x11",
]

[dependencies]
bevy = { version = "0.19.1", default-features = false }
# Same version Bevy itself pins; needed to build a `TableRow` for raw column access.
nonmax = { version = "0.5", default-features = false }
