[package]
name = "bevy_csharp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bridge exposing the Bevy engine to .NET (BevyCSharp)."

[lib]
name = "bevy_csharp"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["headless"]

# The editor profile, the render profile and an interface written in HTML and CSS.
#
# Its own profile rather than part of `render`, because `render` is what CI builds for six
# runtime identifiers and what the test suite links against, and this adds a hundred crates and
# several minutes to a cold build. An editor needs a window regardless, so it starts from render.
#
# It also turns on Bevy's asset watcher, which is what lets a document or a stylesheet be edited
# while the editor runs. That is the whole point of describing an interface in files.
editor = [
    "render",
    "bevy/file_watcher",
    # Bevy's doc comments, kept with its reflected types, so the inspector can show what a field of
    # a light or a camera is for. Here rather than in the render profile because a game shipping on
    # that profile has nobody to show them to and would carry every comment in its library.
    "bevy/reflect_documentation",
]

# Bevy's meshlets, on top of whichever profile is built, meshes cut into clusters that the GPU
# culls and picks a level of detail for, which is virtualized geometry as Bevy ships it.
#
# An addition rather than a profile of its own, and off in every profile, because the processor
# that cuts a mesh into clusters compiles two C and C++ libraries (meshoptimizer and METIS) that
# nothing else needs, and because the plugin wants a GPU with 64-bit texture atomics. Even built
# in, an app turns it on with a cluster budget in its config. wgpu is named to ask the GPU what it
# has before the plugin is added, at the version Bevy already builds, so it adds nothing.
meshlet = [
    "render",
    "bevy/meshlet",
    "bevy/meshlet_processor",
    "dep:wgpu",
]

# Bevy's Solari, direct and indirect lighting traced against the scene with hardware ray queries,
# which is world-space GI and reflections as Bevy ships them.
#
# An addition to a profile like meshlets, and off until an app asks (`Config.RayTracedLighting`),
# because adding it switches every Bevy material to deferred and it runs only on an adapter with
# ray queries, which the bridge asks about before adding it. Pure Rust and shaders, so it adds no
# build dependency; wgpu is named for the same question meshlets ask.
solari = [
    "render",
    "bevy/bevy_solari",
    "dep:wgpu",
]

# A game's assets compiled into the library, so a shipped game is its executable and this, with no
# folder beside them to lose or change. The folder is the one `BEVY_ASSET_PATH` names when the
# library is built, which `build-native.sh --embed <dir>` sets, so this is a build per game rather
# than a profile, and the bridge built with it serves that game alone. Any profile takes it.
embed = []

# The minimal profile, with the app, the ECS, time, input, transforms and math.
# No window, no GPU, no audio. Runs the loop with ScheduleRunnerPlugin.
# This is what CI, unit tests and dedicated servers build.
headless = [
    "bevy/std",
    # Type names, which Bevy discards otherwise. Without this a component can be found by name
    # but never reports one, and an editor showing an entity has nothing to label its rows with.
    "bevy/debug",
    "bevy/async_executor",
    "bevy/multi_threaded",
    "bevy/bevy_log",
    "bevy/keyboard",
    "bevy/mouse",
    # Gamepads as Bevy keeps them, which needs nothing but Rust. Finding a real one is gilrs, in the
    # render profile, and here a pad is one a script or a test connects and presses.
    "bevy/gamepad",
    # Assets are data, not graphics. Including them headless keeps loading testable without a
    # GPU, and means one asset bridge serves both profiles.
    "bevy/bevy_asset",
    "bevy/bevy_mesh",
    "bevy/bevy_image",
    "bevy/png",
    "bevy/jpeg",
    "bevy/webp",
    "bevy/bmp",
    "bevy/tga",
    # Radiance's format, which stores light brighter than white, as a baked lightmap or a sky is.
    "bevy/hdr",
    "bevy/bevy_state",
    # Stepping through a schedule's systems one at a time, as Bevy's breakout and system_stepping
    # do. Two flags in crates the profile has, so it adds nothing to the build, and a schedule with
    # no `Stepping` resource to ask pays one lookup each time it runs.
    "bevy/bevy_debug_stepping",
    "bevy/bevy_world_serialization",
    # Bevy's measures of the process's and the machine's CPU and memory, which an app asks for with
    # `DiagnosticPlugins.SystemInformation`. The sysinfo crate reads them from the system, with
    # ntapi and winapi under it on Windows, and nothing draws, so every profile has them.
    "bevy/sysinfo_plugin",
    # Every reflected type Bevy has, registered at startup without a plugin naming it. The bridge
    # reads components through that registry, so a headless run and the test suite see the same
    # types a window does rather than only the ones some plugin happened to register.
    "bevy/reflect_auto_register",
]

# The full desktop profile, a real window, Bevy's renderer and the winit input backend.
#
# Deliberately assembled feature by feature rather than taking bevy/default_platform, which
# links Wayland at build time. X11 gets in through x11-dl and Wayland through winit's dlopen, both
# at runtime, so on Linux this profile needs two development packages beyond a C compiler, ALSA's
# for audio and libudev's for gamepads, each named below where it comes in.
render = [
    "headless",
    # Asking a window's surface what it can be composited as, before Bevy configures it with
    # something it cannot. The version Bevy builds, so it adds nothing.
    "dep:wgpu",
    # wgpu's counts of the GPU's buffers, textures, pipelines and memory, which the memory command
    # says beside the bridge's own, at the cost of a count kept as each is made and dropped.
    "wgpu/counters",
    # Reading the WGSL a Slang shader compiles to, to check its bindings before a pipeline is
    # built with them. Bevy already depends on this version with this feature, so it adds nothing
    # to the build.
    "dep:naga",
    # A compute shader compiled to SPIR-V, for what WGSL cannot say, such as a ray query. The first
    # lets Bevy take SPIR-V at all, and the second hands it to a Vulkan driver untouched rather than
    # through naga, whose SPIR-V reader has no ray queries. Both are Rust already in the tree.
    "bevy/shader_format_spirv",
    "bevy/spirv_shader_passthrough",
    "bevy/bevy_asset",
    "bevy/bevy_state",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    # Everything the camera does to the picture after the scene is drawn, bloom, depth of field,
    # motion blur, and the antialiasing that runs as a pass rather than in the rasterizer. Both
    # are pure Rust and shaders, so neither adds a build dependency.
    "bevy/bevy_post_process",
    "bevy/bevy_anti_alias",
    "bevy/smaa_luts",
    "bevy/bevy_pbr",
    # Soft shadows, whose penumbra widens with distance from the caster. Shader code behind a
    # define, used only by a light given a size, so a scene without one draws as before.
    "bevy/experimental_pbr_pcss",
    # The maps a standard material can have past the five every renderer knows, which are
    # clearcoat and its roughness and normal, transmission and thickness, anisotropy's direction,
    # and how much and in what color a non-metal reflects. Each is a binding and a define, so a
    # material without one costs a texture slot it leaves empty, and a glTF file's clearcoat,
    # transmission, anisotropy and specular extensions bring theirs along.
    "bevy/pbr_multi_layer_material_textures",
    "bevy/pbr_transmission_textures",
    "bevy/pbr_anisotropy_texture",
    "bevy/pbr_specular_textures",
    # A picture a light shines through, as a spot light's cookie or a point light's cube of them,
    # and the decals clustered with the lights that draw them. Shader code behind defines, so a
    # scene without either draws as before, where a GPU without binding arrays leaves them out.
    "bevy/pbr_light_textures",
    "bevy/bevy_gltf",
    # Skeletal and transform animation, which a glTF file's clips play through. Pure Rust, and
    # with it the glTF loader builds the clips and the animation graph players read, so a model's
    # clips can be played by name.
    "bevy/bevy_animation",
    "bevy/gltf_animation",
    # The curves and easings a clip built from C# is made of, a crate of their own since Bevy 0.20
    # that animation already compiles, which the feature only makes reachable as `bevy::curve`.
    "bevy/bevy_curve",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    # A node the layout passes through to its children as though they were its parent's, which
    # groups nodes for a game's own bookkeeping without a box of its own, as Bevy's ghost_nodes
    # shows. A feature of the interface crate already built, which adds no crate.
    "bevy/ghost_nodes",
    # Bevy's own widgets, its headless buttons, checkboxes, sliders, scroll bars and menus, and the
    # editable text a text field is, which lives with them because typing into one is input a
    # widget handles. They are added with the rest of Bevy's defaults. The interface's picking
    # comes with them, since a click gives a field its focus and drags a slider.
    "bevy/bevy_ui_widgets",
    "bevy/ui_picking",
    # What a pointer is over and does to it, the interface's nodes, sprites and meshes, as a game
    # observes it. Picking is here already for the interface, and these are its backends for the
    # other two. Sprites are picked as Bevy's default plugins pick them, and meshes only in an app
    # that asks (`Config.MeshPicking`), since Bevy's mesh picking casts a ray at every mesh as the
    # pointer moves and Bevy's own programs leave it out unless they use it.
    "bevy/bevy_picking",
    "bevy/sprite_picking",
    "bevy/mesh_picking",
    # Bevy's camera controllers, the free camera that flies with the keys and turns with the
    # mouse, the pan camera that moves a 2D view, and the pan-orbit camera that turns about the
    # point under the pointer, with the dot its gizmo draws there. One crate of plain Rust, whose
    # plugins an app asks for (`Config.CameraControllers`) and whose systems do nothing for a camera
    # without the controller's component.
    "bevy/free_camera",
    "bevy/pan_camera",
    "bevy/pan_orbit_camera",
    "bevy/pan_orbit_gizmo",
    "dep:bevy_camera_controller",
    "bevy_camera_controller/bevy_reflect",
    # Feathers, Bevy's styled widgets over its headless ones, with their dark theme and the fonts,
    # icons and shaders they draw with, embedded. One crate of plain Rust over the interface Bevy
    # draws already, whose plugins an app asks for (`Config.Feathers`).
    "bevy/bevy_feathers",
    # Bevy's dev tools, the FPS overlay with its frame time graph, the infinite grid that stands for
    # a ground plane in a tool, and the overlay and log of what picking finds under each pointer.
    # One crate of plain Rust and shaders over the renderer and interface Bevy draws already, whose
    # plugins an app asks for (`Config.DevTools`).
    "bevy/bevy_dev_tools",
    "bevy/render_dev_tools",
    # A pointer drawn from an image of the game's own, as Bevy's window_settings shows one. The
    # image and asset crates and wgpu's types it reaches are in the profile already, so it adds
    # nothing to the build.
    "bevy/custom_cursor",
    "bevy/bevy_gizmos",
    "bevy/bevy_gizmos_render",
    # Sound. Unlike everything else here this needs a system library at build time, cpal, which
    # Bevy's audio sits on, links against ALSA on Linux. That is why it is in this profile and
    # not the minimal one, which stays buildable with nothing but a C compiler.
    # Real gamepads, found and read by gilrs. On Linux it reads them through libudev, whose
    # development headers a build needs as audio needs ALSA's, which is why it is here and not in
    # the minimal profile.
    "bevy/bevy_gilrs",
    "bevy/bevy_audio",
    "bevy/vorbis",
    "bevy/wav",
    "bevy/flac",
    "bevy/mp3",
    "bevy/bevy_scene",
    "bevy/default_font",
    "bevy/ktx2",
    "bevy/zstd_rust",
    "bevy/tonemapping_luts",
    # Spatio-temporal blue noise, a hundred and twenty eight pixels square and thirty two frames
    # deep, which every stochastic screen-space technique samples its rays with, and which a shader
    # on a camera reads through `passBlueNoise`. A megabyte and a half, embedded.
    "bevy/bluenoise_texture",
    # The tables a rectangular area light is shaded with, 46 kilobytes, embedded. Without them Bevy
    # draws no light from a RectLight and says so once.
    "bevy/area_light_luts",
    # The table a standard material's specular term is lit from, 64 by 64 pairs of half floats, 14
    # kilobytes compressed with zstd, embedded, where a bridge without it lights the term from a
    # fitted curve. Solari turns it on as well, so with it here a bridge built with --solari lights a
    # standard material as one without does, and a picture taken on either is the same. It needs the
    # image features above and adds no crate.
    "bevy/dfg_lut",
    # Windowing backends. Both are harmless off-platform. Winit gates its X11 and Wayland
    # dependencies to Linux and the BSDs, so on Windows and macOS these resolve to nothing and
    # the native window system is used instead.
    "bevy/x11",
    "bevy/wayland",
    "winit/wayland-dlopen",
]

[dependencies]
bevy = { version = "0.20.0", default-features = false }
# Default features pull libsqlite3-sys with `bundled`, which compiles SQLite from C source at
# build time for an i18n stack the bridge does not use, so they are off and only the breakpoint
# support is turned back on.
# Same version Bevy itself pins; needed to build a `TableRow` for raw column access.
nonmax = { version = "0.5", default-features = false }
# Casting the interface's vertices to bytes for the GPU. The same crate Bevy uses for it, so the
# version is already in the tree.
bytemuck = { version = "1", features = ["derive"] }
naga = { version = "30", default-features = false, features = ["wgsl-in"], optional = true }
# Bevy's camera controllers, named directly for their reflection, which Bevy builds the crate
# without, so the pan-orbit camera's components could not be read or written from C#. The crate is
# in the tree through Bevy and its reflection crate is too, so this adds no crate.
bevy_camera_controller = { version = "0.20.0", default-features = false, optional = true }
# Components read and written through Bevy's reflection cross the boundary as JSON, in every
# profile, and the render profile also reads the reflection slangc writes beside every compile.
# Already in the tree through Bevy.
serde_json = "1"
# The trait a reflected value is deserialized through. Already in the tree through Bevy, which
# re-exports the reflect serializers but not the trait their seed implements.
serde = "1"
wgpu = { version = "30", default-features = false, optional = true }
# Named directly for two things Bevy does not reach, on every platform, a window's icon, which
# winit sets on its own window (`Icon`, `set_window_icon`) and Bevy's `Window` carries none of,
# and on Linux and the BSDs Wayland loaded at runtime. Bevy's `wayland` feature switches on
# winit's Wayland backend, which by default links libwayland at build time and so needs the
# Wayland development headers present, and `wayland-dlopen` loads the library at runtime
# instead, so the bridge builds on any machine with a C compiler alone and the one binary works
# on both X11 and Wayland sessions. winit gates its Wayland half to those systems, so the
# feature names nothing on Windows and macOS. The same version Bevy pins, already in the tree.
winit = { version = "0.30", default-features = false, optional = true }
