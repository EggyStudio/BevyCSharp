# bevy_weather 0.2.0 as upstream published it, kept here as a member of the bridge's workspace and
# ported with the bridge. Three things are left out of upstream's manifest and tree: its examples
# and the dev-dependency on Bevy's default plugins and dev tools they need, which would add crates
# the bridge does not otherwise build; and its profiles, which a workspace member's manifest cannot
# set. Its tests build on its own dependencies alone.

[package]
name = "bevy_weather"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "A complete, reusable weather and sky plugin for Bevy: day/night cycle, procedural stars and galaxy, moon phases, volumetric clouds, volumetric fog, rain, snow and thunder."
repository = "https://github.com/etwodev/bevy_weather"
readme = "README.md"
keywords = ["bevy", "weather", "sky", "clouds", "gamedev"]
categories = ["game-development", "rendering"]
exclude = ["/.github", "/assets", "/.cargo"]

[features]
default = ["audio"]
audio = ["bevy/bevy_audio", "bevy/vorbis"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "pbr_light_textures",
] }

[lints.rust]
missing-docs = "warn"
